version: 2

# Without this file Dependabot only ever raises *security* updates (and even
# those go quiet when no safe path exists — see the uuid override in
# apps/mobile/package.json). This turns on ordinary version updates too.
updates:
  - package-ecosystem: npm
    # apps/mobile has its own package-lock.json; the repo root isn't an npm project.
    directory: /apps/mobile
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # The Expo SDK set is version-locked: expo, react-native, React itself and
      # every expo-*/@expo/* package have to move together or the app won't
      # build. One PR per package is just a pile of red CI — the first run
      # proved it, bumping react to 19.2.8 while react-dom stayed on 19.2.3,
      # which broke the bundler so hard the dev server never came up.
      expo-sdk:
        patterns:
          - expo
          - expo-*
          - "@expo/*"
          - react
          - react-dom
          - "@types/react"
          - react-native
          - react-native-*
          - "@react-native*"
      dev-tooling:
        dependency-type: development
      # Everything left over is transitive: lockfile-only bumps nothing here
      # asks for by name. Dependabot puts a dependency in the first group it
      # matches, so this catch-all sits last and only ever sees what the two
      # groups above didn't claim. Without it each one is its own PR — js-yaml,
      # browserslist and baseline-browser-mapping opened three in a week.
      transitive:
        patterns:
          - "*"
    # The lint toolchain is only coherent with the versions eslint-config-expo
    # was built against, and nothing here pins that for it. A grouped dev-tooling
    # bump to eslint 10 + typescript 7 (#5) broke `npm run lint` outright — twice
    # over, since eslint-plugin-react uses APIs eslint 10 removed and no
    # published typescript-eslint supports typescript 7. CI now runs eslint, so
    # a repeat would at least go red; keeping majors out of the automatic group
    # means they arrive as a deliberate upgrade instead.
    ignore:
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]

      # Grouping the Expo SDK set keeps it moving together; it does nothing to
      # stop the whole group moving past the SDK together, which is what #28
      # was. Both jobs went red for unrelated reasons — react-native 0.87 drops
      # the ./rn-get-polyfills subpath that SDK 57's bundler imports, and
      # @types/react 19.3 rejects the useRef<View> in scotland-map.tsx — which
      # is the shape of the problem: these versions are only ever tested as a
      # set, by Expo, and the set is named by the SDK.
      #
      # Patches still come through, so a security fix inside the SDK is not
      # blocked. Anything that crosses to another SDK's set arrives the only
      # way it works: `npx expo install --fix` on the new SDK, deliberately.
      - dependency-name: react-native
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: react
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: react-dom
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: "@types/react"
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: expo
        update-types: [version-update:semver-major]
      - dependency-name: expo-*
        update-types: [version-update:semver-major]
      - dependency-name: react-native-*
        update-types: [version-update:semver-major]
      - dependency-name: "@react-native*"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
