name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      # Enables Pages (build_type=workflow) on the first run using the built-in
      # token, so no manual toggle in repo settings is needed.
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
        with:
          enablement: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - name: Export static web build
        run: npx expo export --platform web
      # The export renders every route once, at build time. Anything derived
      # from the clock is therefore frozen at the build and served as though it
      # were current — which for a tide app means plausible, wrong tide times
      # before hydration, plus a hydration mismatch (React #418). The screens
      # gate that on `useHydrated`; this makes sure it stays gated.
      - name: Assert no build-time clock data in the HTML
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          pats = {
              'relative time': r'\d+h \d+m ago|in \d+h \d+m',
              'long date': r'(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday) \d+ \w+ 20\d\d',
              'clock time': r'>\d\d:\d\d<',
          }
          bad = 0
          for f in pathlib.Path('dist').rglob('*.html'):
              h = f.read_text(encoding='utf8')
              for name, pat in pats.items():
                  for m in set(re.findall(pat, h)):
                      print(f'{f}: baked {name}: {m}')
                      bad += 1
          print('clean' if not bad else f'{bad} baked clock strings')
          sys.exit(1 if bad else 0)
          PY
      # Pages served from an Actions artifact isn't run through Jekyll, but add
      # .nojekyll anyway so the underscore-prefixed _expo/ dir is never stripped.
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/mobile/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
