name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Formatting/lint and types are declared standards (root `npm run check`,
  # a clean `tsc`) but nothing enforced them, so drift landed on main unnoticed.
  # Separate job so it runs in parallel with the slower test job.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      # Needed for the typecheck below (deps supply the ambient types).
      - run: npm ci
        working-directory: apps/mobile
      # Biome comes from devenv (pkgs.biome) locally; CI has no nix, so pin the
      # same version here — formatter output drifts between Biome majors, and an
      # unpinned CI copy would flag code the devshell considers correctly
      # formatted. Bump in step with devenv's biome. `ci` never writes.
      - name: Format + lint (Biome)
        run: npx --yes @biomejs/biome@2.5.4 ci apps/mobile
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: apps/mobile

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - name: Unit tests (datetime, tide-day)
        run: npm run test:unit
      - name: Engine parity tests (vs pytides reference)
        run: npm run test:engine
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
