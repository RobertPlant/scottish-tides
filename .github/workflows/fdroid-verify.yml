name: F-Droid reproducibility check

# Builds this commit twice per ABI, once through release.yml and once the way
# F-Droid's buildserver does (fdroiddata's "fdroid build" CI job, trimmed to this
# app), and checks our signature fits each of F-Droid's builds. If it doesn't, F-Droid rejects the
# release. Run it before tagging whenever release.yml, the recipe's build steps,
# or native dependencies change. PRs that touch the build run it by themselves.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - fdroid/**
      - .github/workflows/release.yml
      - .github/workflows/fdroid-verify.yml

jobs:
  ours:
    uses: ./.github/workflows/release.yml
    secrets: inherit
    permissions:
      contents: write

  fdroid:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # n = the build's position in the recipe (and release.yml's matrix).
        include:
          - { n: 1, abi: armeabi-v7a }
          - { n: 2, abi: arm64-v8a }
          - { n: 3, abi: x86 }
          - { n: 4, abi: x86_64 }
    container: registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie
    defaults:
      run:
        shell: bash
    env:
      ANDROID_HOME: /opt/android-sdk
      COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: fdroid build
        run: |
          set -euxo pipefail
          source /etc/profile.d/bsenv.sh
          apt-get update
          apt-get install -y sudo openjdk-21-jdk-headless
          update-alternatives --set java /usr/lib/jvm/java-21-openjdk-amd64/bin/java
          sdkmanager "platform-tools" "build-tools;31.0.0"
          rm -rf "$fdroidserver"
          git clone --depth 1 https://gitlab.com/fdroid/fdroidserver.git "$fdroidserver"
          git -C "$home_vagrant/gradlew-fdroid" pull

          app=com.robertplant.scottishtides
          vercode=$(sed -n 's/^    versionCode: //p' "fdroid/$app.yml" | sed -n '${{ matrix.n }}p')
          mkdir -p "$home_vagrant"/{metadata,tmp,unsigned,logs}
          # The committed recipe, building this commit, minus each binary: (it
          # points at a published release; the compare job checks against ours).
          sed -e "s/^    commit: .*/    commit: $COMMIT/" -e '/^    binary:/d' \
            -e '/^      https:\/\/github.com\/RobertPlant\/scottish-tides\/releases\//d' \
            "fdroid/$app.yml" > "$home_vagrant/metadata/$app.yml"
          ! grep -n 'releases/download' "$home_vagrant/metadata/$app.yml"
          chown -R vagrant "$home_vagrant"

          cd "$home_vagrant"
          fdroid() {
            sudo --preserve-env --user vagrant env \
              PATH="$fdroidserver:$PATH" \
              PYTHONPATH="$fdroidserver:$fdroidserver/examples" \
              HOME="$home_vagrant" GRADLE_USER_HOME="$home_vagrant/.gradle" \
              fdroid "$@"
          }
          fdroid fetch_repo "$app:$vercode" --verbose # clones the app into build/
          fdroid build --verbose --test --refresh-scanner --on-server --no-tarball "$app:$vercode"
          cp "tmp/${app}_${vercode}.apk" "$GITHUB_WORKSPACE/fdroid-${{ matrix.abi }}.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: fdroid-${{ matrix.abi }}
          path: fdroid-${{ matrix.abi }}.apk

  compare:
    needs: [ours, fdroid]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - run: |
          PATH="$PATH:$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)" # apksigner
          # Entries whose CRC differs, which usually names the culprit.
          entries() { unzip -v "$1" | awk '$8 !~ /^META-INF\// {print $7, $8}' | sort -k2; }
          failed=0
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            ours=$(ls scottish-tides-*-"$abi".apk)
            if pipx run apksigcopier compare --unsigned "$ours" "fdroid-$abi.apk"; then
              echo "$abi: reproducible, F-Droid's build takes our signature."
            else
              echo "$abi: DIFFERS"; diff <(entries "$ours") <(entries "fdroid-$abi.apk") || true
              failed=1
            fi
          done
          exit $failed
