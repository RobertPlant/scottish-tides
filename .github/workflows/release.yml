name: Release APK

# Tag a commit v<version> and this builds, signs and publishes the APK as a
# public release asset — the download link for people not using F-Droid.
#
# F-Droid builds are reproducible: F-Droid rebuilds the tag, checks it matches
# this APK byte for byte (signature aside), then ships it with OUR signature
# (`Binaries:` / `AllowedAPKSigningKeys:` in the recipe). So both channels are
# upgrade-compatible, but only while this build mirrors the recipe exactly:
# same Node, `npm ci --omit=dev`, same build path, JDK 21, no post-processing
# of the APK. Change one, change both, and run fdroid-verify.yml.
on:
  push:
    tags: ['v*']
  # Manual runs build and sign exactly the same way but publish nothing — the
  # APK is left as a build artifact, so the signing path can be exercised
  # without minting a junk release.
  workflow_dispatch:
  # fdroid-verify.yml builds our side of the comparison through this.
  workflow_call:

permissions:
  contents: write # needed to create the release

env:
  EXPO_NO_TELEMETRY: 1
  # F-Droid's build path. Native libraries embed it, so building anywhere else
  # changes the bytes.
  APP: /home/vagrant/build/com.robertplant.scottishtides/apps/mobile

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # On a PR (via fdroid-verify.yml), the branch head rather than the
          # merge commit: F-Droid can only build a commit it can fetch, and
          # the commit ID ends up inside the APK.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Move to F-Droid's build path
        run: |
          sudo mkdir -p /home/vagrant/build
          sudo chown "$USER" /home/vagrant/build
          cp -a "$GITHUB_WORKSPACE" /home/vagrant/build/com.robertplant.scottishtides
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0 # = the recipe's `sudo:` Node
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21 # fdroiddata's build job uses openjdk-21

      - run: npm ci --omit=dev
        working-directory: ${{ env.APP }}

      # android/ is generated (Expo CNG), not committed.
      - name: Generate the native project
        run: ./node_modules/.bin/expo prebuild --platform android --no-install
        working-directory: ${{ env.APP }}

      # The Expo template signs release builds with its own debug keystore,
      # whose password is public. Strip it so Gradle emits an unsigned APK and
      # we sign with the real key below. Same step the F-Droid recipe uses.
      - name: Drop the template's debug signing config
        run: sed -i '/signingConfig signingConfigs.debug/d' android/app/build.gradle
        working-directory: ${{ env.APP }}

      - name: Build
        run: ./gradlew assembleRelease -x lintVitalRelease
        working-directory: ${{ env.APP }}/android

      # F-Droid eligibility is a property of the APK, not of the source: any
      # dependency can drag Play Services back in. Assert it here so a bad
      # dependency fails the release rather than shipping quietly.
      - name: Assert no Google Play Services
        run: |
          python3 - <<'EOF'
          import sys, zipfile
          apk = '${{ env.APP }}/android/app/build/outputs/apk/release/app-release-unsigned.apk'
          z = zipfile.ZipFile(apk)
          hits = sum(z.read(n).count(b'com/google/android/gms')
                     for n in z.namelist() if n.endswith('.dex'))
          print(f'play-services refs: {hits}')
          sys.exit(1 if hits else 0)
          EOF

      - name: Sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          # Not a secret, and deliberately not one: as a secret its value gets
          # masked everywhere, so the logs showed the APK as "***.apk".
          KEY_ALIAS: scottish-tides
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "$KEYSTORE_B64" | base64 -d > /tmp/release.jks
          # Sign Gradle's output as-is (it's already aligned). Re-aligning would
          # change bytes F-Droid's unsigned build has, and our signature would
          # no longer fit it.
          "$BUILD_TOOLS/apksigner" sign \
            --ks /tmp/release.jks \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --out scottish-tides.apk \
            "$APP/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          "$BUILD_TOOLS/apksigner" verify --print-certs scottish-tides.apk
          rm -f /tmp/release.jks

      - name: Upload artifact (runs that don't publish)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: scottish-tides-apk
          path: scottish-tides.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" scottish-tides.apk \
            --title "Scottish Tides ${GITHUB_REF_NAME}" \
            --generate-notes
