name: Release APK

# Tag a commit v<version> and this builds, signs and publishes one APK per ABI
# as public release assets — the download links for people not using F-Droid.
#
# F-Droid builds are reproducible: F-Droid rebuilds the tag per ABI, checks each
# matches the APK here byte for byte (signature aside), then ships it with OUR
# signature (`binary:` / `AllowedAPKSigningKeys:` in the recipe). So both
# channels are upgrade-compatible, but only while this build mirrors the recipe
# exactly: same Node, `npm ci --omit=dev`, the JDK 21 patch, same paths, same
# Gradle properties, no post-processing of the APK. Change one, change both,
# and run fdroid-verify.yml.
on:
  push:
    tags: ['v*']
  # Manual runs build and sign exactly the same way but publish nothing — the
  # APK is left as a build artifact, so the signing path can be exercised
  # without minting a junk release.
  workflow_dispatch:
  # fdroid-verify.yml builds our side of the comparison through this.
  workflow_call:

permissions:
  contents: write # needed to create the release

env:
  EXPO_NO_TELEMETRY: 1
  # F-Droid's build path. Native libraries embed it, so building anywhere else
  # changes the bytes.
  APP: /home/vagrant/build/com.robertplant.scottishtides/apps/mobile
  # Same for the Gradle cache (C++ headers React Native ships are compiled from
  # there, and their paths end up in the .so files) and the SDK/NDK.
  GRADLE_USER_HOME: /home/vagrant/.gradle

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # report every ABI, not just the first to fail
      matrix:
        # Order sets the versionCode: 10 * base + position (plugins/with-abi-split.js,
        # the recipe's VercodeOperation).
        abi: [armeabi-v7a, arm64-v8a, x86, x86_64]
    steps:
      - uses: actions/checkout@v7
        with:
          # On a PR (via fdroid-verify.yml), the branch head rather than the
          # merge commit: F-Droid can only build a commit it can fetch, and
          # the commit ID ends up inside the APK.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Move to F-Droid's paths
        run: |
          sudo mkdir -p /home/vagrant/build /home/vagrant/.gradle /opt/android-sdk
          sudo chown "$USER" /home/vagrant/build /home/vagrant/.gradle
          cp -a "$GITHUB_WORKSPACE" /home/vagrant/build/com.robertplant.scottishtides
          # A bind mount, not a symlink: compilers record the path they're given.
          sudo mount --bind "$ANDROID_HOME" /opt/android-sdk
          echo ANDROID_HOME=/opt/android-sdk >> "$GITHUB_ENV"
          echo ANDROID_SDK_ROOT=/opt/android-sdk >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0 # = Debian forky's nodejs, which the recipe installs
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21 # fdroiddata's build job; see the toolchain patch below

      - run: npm ci --omit=dev
        working-directory: ${{ env.APP }}

      # React Native and some libraries pin JDK 17 (toolchain, Java and Kotlin
      # targets); F-Droid's buildserver only has 21. The recipe's patch,
      # verbatim (the form accepted in fdroiddata for other Expo apps).
      - name: Build with JDK 21
        run: >-
          find node_modules -type f \( -name '*.gradle' -o -name '*.gradle.kts' -o -name '*.kt' \)
          -exec sed -i -e 's/JavaVersion.VERSION_17/JavaVersion.VERSION_21/g'
          -e 's/jvmToolchain(17)/jvmToolchain(21)/g'
          -e 's/JvmTarget.fromTarget("17")/JvmTarget.fromTarget("21")/g'
          -e "s/jvmTarget = '17'/jvmTarget = '21'/g" {} +
        working-directory: ${{ env.APP }}

      # android/ is generated (Expo CNG), not committed.
      - name: Generate the native project
        run: ./node_modules/.bin/expo prebuild --platform android --no-install
        working-directory: ${{ env.APP }}

      # The Expo template signs release builds with its own debug keystore,
      # whose password is public. Strip it so Gradle emits an unsigned APK and
      # we sign with the real key below. Same step the F-Droid recipe uses.
      - name: Drop the template's debug signing config
        run: sed -i '/signingConfig signingConfigs.debug/d' android/app/build.gradle
        working-directory: ${{ env.APP }}

      - name: Build
        # The recipe's gradleprops. The dev-server IP is otherwise the build
        # machine's, baked into resources.arsc. Toolchain auto-detection is off
        # so a stray JDK 17 on the runner can't be used where F-Droid has none.
        # The heap override beats the 1.5 GB cap plugins/with-low-memory-gradle.js
        # writes for low-RAM dev boxes: R8 needs more. Heap doesn't change the APK.
        run: >-
          ./gradlew assembleRelease -x lintVitalRelease
          "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"
          -PreactNativeArchitectures=${{ matrix.abi }}
          -PreactNativeDevServerIp=localhost
          -Porg.gradle.java.installations.auto-detect=false
        working-directory: ${{ env.APP }}/android

      # What F-Droid reviewers check, asserted on the APK itself so a bad
      # dependency or config fails the release rather than shipping quietly:
      # no Play Services, only this ABI's native code, no permissions the app
      # doesn't use, and the per-ABI versionCode.
      - name: Check the APK
        run: |
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt2" dump badging "$APK" > badging.txt
          python3 - <<'EOF'
          import json, os, re, sys, zipfile
          abi = '${{ matrix.abi }}'
          z = zipfile.ZipFile(os.environ['APK'])
          badging = open('badging.txt').read()
          base = json.load(open('${{ env.APP }}/app.json'))['expo']['android']['versionCode']
          want = base * 10 + ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'].index(abi) + 1
          got = int(re.search(r"versionCode='(\d+)'", badging).group(1))
          gms = sum(z.read(n).count(b'com/google/android/gms') for n in z.namelist() if n.endswith('.dex'))
          abis = {n.split('/')[1] for n in z.namelist() if n.startswith('lib/')}
          perms = set(re.findall(r"uses-permission: name='([^']+)'", badging))
          banned = perms & {'android.permission.INTERNET', 'android.permission.SYSTEM_ALERT_WINDOW',
                            'android.permission.READ_EXTERNAL_STORAGE', 'android.permission.WRITE_EXTERNAL_STORAGE'}
          print(f'versionCode {got} (want {want}), ABIs {sorted(abis)}, play-services refs {gms}')
          print('permissions:', *sorted(perms), sep='\n  ')
          ok = got == want and abis == {abi} and not gms and not banned
          sys.exit(0 if ok else f'APK check failed (unwanted permissions: {sorted(banned)})')
          EOF
        env:
          APK: ${{ env.APP }}/android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          # Not a secret, and deliberately not one: as a secret its value gets
          # masked everywhere, so the logs showed the APK as "***.apk".
          KEY_ALIAS: scottish-tides
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          VERSION=$(node -p "require('$APP/app.json').expo.version")
          OUT="scottish-tides-$VERSION-${{ matrix.abi }}.apk"
          echo "$KEYSTORE_B64" | base64 -d > /tmp/release.jks
          # Sign Gradle's output as-is (it's already aligned). Re-aligning, by
          # zipalign or apksigner's own default, would change bytes F-Droid's
          # unsigned build has, and our signature would no longer fit it.
          "$BUILD_TOOLS/apksigner" sign \
            --alignment-preserved \
            --ks /tmp/release.jks \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --out "$OUT" \
            "$APP/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$OUT"
          rm -f /tmp/release.jks

      - uses: actions/upload-artifact@v7
        with:
          name: apk-${{ matrix.abi }}
          path: scottish-tides-*.apk

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: apk-*
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" scottish-tides-*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Scottish Tides ${GITHUB_REF_NAME}" \
            --generate-notes
