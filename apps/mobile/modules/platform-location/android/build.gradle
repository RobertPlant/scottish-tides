plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.robertplant.platformlocation'
version = '0.1.0'

android {
  namespace 'com.robertplant.platformlocation'
  // expo-module-gradle-plugin requires both, or evaluation of :expo fails with
  // "'android.defaultConfig.versionName' is not defined".
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

// No dependencies on purpose: LocationManager is in the platform SDK, and
// androidx.core (LocationManagerCompat) comes through expo-modules-core.
