Categories:
  - Navigation
  - Sports & Health
License: GPL-3.0-only
AuthorName: Robert Plant
SourceCode: https://github.com/RobertPlant/scottish-tides
IssueTracker: https://github.com/RobertPlant/scottish-tides/issues

AutoName: Scottish Tides

RepoType: git
Repo: https://github.com/RobertPlant/scottish-tides.git

Builds:
  - versionName: 0.1.4
    versionCode: 5
    commit: v0.1.4
    subdir: apps/mobile
    sudo:
      - curl -fsSLo /tmp/node.tar.xz https://nodejs.org/dist/v24.21.0/node-v24.21.0-linux-x64.tar.xz
      - echo 'fd8e59d5a511510f6a298afb548f18c7d2b1be404d8b4a27d94fbe49f56cb2d6  /tmp/node.tar.xz'
        | sha256sum -c -
      - tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
    output: android/app/build/outputs/apk/release/app-release-unsigned.apk
    prebuild:
      - export EXPO_NO_TELEMETRY=1
      - npm ci --omit=dev
      - ./node_modules/.bin/expo prebuild --platform android --no-install
      - sed -i '/signingConfig signingConfigs.debug/d' android/app/build.gradle
    scanignore:
      - apps/mobile/node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
      - apps/mobile/node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - apps/mobile/node_modules/react-native/ReactAndroid/publish.gradle
      - apps/mobile/node_modules/@react-native-async-storage/async-storage/android/build.gradle
      - apps/mobile/node_modules/@react-native-masked-view/masked-view/android/build.gradle
      - apps/mobile/node_modules/react-native-safe-area-context/android/build.gradle
      - apps/mobile/node_modules/react-native-screens/android/build.gradle
      - apps/mobile/node_modules/react-native-svg/android/build.gradle
    scandelete:
      - apps/mobile/node_modules
    build:
      - export EXPO_NO_TELEMETRY=1
      - cd android
      - gradle assembleRelease -x lintVitalRelease
    ndk: r27b

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[\d.]+$
UpdateCheckData: apps/mobile/app.json|"versionCode":\s*(\d+)|apps/mobile/app.json|"version":\s*"([\d.]+)"
CurrentVersion: 0.1.4
CurrentVersionCode: 5
